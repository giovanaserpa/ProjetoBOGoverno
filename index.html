<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Custos e Transparência — Pernambuco</title>
<meta name="description" content="Duas perguntas sobre o dinheiro de Pernambuco: com o que o Estado gastou, e quanto custa manter cada serviço. Dado oficial do E-Fisco e estimativas de custo com o método aberto.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main id="conteudo">

  <!-- quanto é o orçamento e como ele percorre o ano -->
  <div id="abertura"></div>

  <!-- as duas perguntas, lado a lado, antes de qualquer tabela -->
  <div class="container"><div id="bifurcacao"></div></div>

  <!-- ================= TRILHA 1 — DESPESA ================= -->
  <div class="container">
    <div data-trilha="despesa" id="trilha-despesa"></div>

    <!-- de onde vem o dinheiro -->
    <div id="receita"></div>

    <!-- para onde ele vai, por área -->
    <div id="faixa-orcamento"></div>

    <!-- quem executa: as principais despesas por órgão -->
    <section class="card grid-row" id="orgaos">
      <div class="card__header">
        <h2 class="card__title" data-titulo-ranking></h2>
        <a class="card__link" href="#">Ver todos os órgãos</a>
      </div>
      <div class="card__body">
        <ol class="ranking-list"></ol>
        <p class="chart-caption" data-nota-ranking></p>
      </div>
    </section>

    <!-- consultas do lado da despesa -->
    <div data-secao="Consultas sobre despesas" data-secao-fixa data-icone="orgao"></div>
    <ul class="cartoes" data-cartoes="despesa"></ul>

    <!-- comparar dois órgãos: a frase do desafio -->
    <section class="card">
      <div class="card__header">
        <h2 class="card__title" data-titulo-comparador></h2>
      </div>
      <div class="comparador">
        <div>
          <label for="mun-a" data-rotulo-a></label>
          <select id="mun-a"></select>
        </div>
        <div>
          <label for="mun-b" data-rotulo-b></label>
          <select id="mun-b"></select>
        </div>
        <button type="button">Comparar</button>
      </div>
      <p class="comparador__result">Selecione dois para comparar.</p>
    </section>
  </div>

  <!-- ================= TRILHA 2 — CUSTO ================= -->
  <div class="container">
    <div data-trilha="custo" id="trilha-custo"></div>

    <!-- principais custos unitários e as lacunas -->
    <div id="custos-resumo"></div>

    <!-- os 185 municípios nas duas leituras -->
    <div id="municipios"></div>

    <!-- consultas do lado do custo -->
    <div data-secao="Consultas sobre custos" data-secao-fixa data-icone="custo-area"></div>
    <ul class="cartoes" data-cartoes="custo"></ul>
  </div>

</main>

<div id="site-footer"></div>

<script src="assets/js/dados.js"></script>
<script src="assets/js/componentes.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/assistente.js"></script>
</body>
</html>
