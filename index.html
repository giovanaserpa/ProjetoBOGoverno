<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal da Transparência — Pernambuco</title>
<meta name="description" content="Quanto o Estado de Pernambuco reservou e quanto já gastou: execução orçamentária, repartição por área e despesa por órgão.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main id="conteudo">

  <!-- quanto é, e como o dinheiro percorre o ano -->
  <div id="abertura"></div>

  <div class="container">

    <!-- para onde vai: a faixa comanda a leitura e o gráfico -->
    <div id="faixa-orcamento"></div>

    <!-- de onde vem o dinheiro, e quanto já entrou -->
    <div id="receita"></div>

    <!-- para onde vai, por município -->
    <section class="card grid-row" id="municipios">
      <div class="card__header">
        <h2 class="card__title" data-titulo-ranking></h2>
        <a class="card__link" href="#">Ver os 185 municípios</a>
      </div>
      <div class="card__body">
        <ol class="ranking-list"></ol>
        <p class="chart-caption" data-nota-ranking></p>
      </div>
    </section>

    <!-- comparar dois -->
    <section class="card">
      <div class="card__header">
        <h2 class="card__title" data-titulo-comparador></h2>
      </div>
      <div class="comparador">
        <div>
          <label for="mun-a" data-rotulo-a></label>
          <select id="mun-a"></select>
        </div>
        <div>
          <label for="mun-b" data-rotulo-b></label>
          <select id="mun-b"></select>
        </div>
        <button type="button">Comparar</button>
      </div>
      <p class="comparador__result">Selecione dois para comparar.</p>
    </section>

    <!-- navegação, no fim -->
    <div data-secao="Consultas sobre despesas" data-icone="orgao"></div>
    <ul class="cartoes"></ul>

  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/dados.js"></script>
<script src="assets/js/componentes.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/assistente.js"></script>
</body>
</html>
